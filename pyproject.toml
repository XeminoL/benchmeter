[project]
name = "benchmeter"
version = "1.0.0"
description = "Performance measurement that reports its own reliability"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Source = "https://github.com/XeminoL/benchmeter"

[project.scripts]
benchmeter = "benchmeter.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["benchmeter", "benchmeter.web"]

[tool.setuptools.package-data]
"benchmeter.web" = ["static/*"]