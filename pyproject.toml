[project]
name = "benchmeter"
version = "0.1.0"
description = "Performance measurement that reports its own reliability"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
benchmeter = "benchmeter.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["benchmeter", "benchmeter.web"]

[tool.setuptools.package-data]
"benchmeter.web" = ["static/*"]